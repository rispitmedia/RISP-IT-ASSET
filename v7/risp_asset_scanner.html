<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071321"><title>RISP QR Scanner</title><style>
*{box-sizing:border-box}body{margin:0;background:#071321;color:#e5f2fc;font:15px/1.5 system-ui}main{max-width:640px;margin:auto;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}h1{margin-bottom:6px}p{color:#9db3c6}.camera{position:relative;aspect-ratio:1;border:1px solid #355671;border-radius:24px;overflow:hidden;background:#02070c}video{width:100%;height:100%;object-fit:cover}.guide{position:absolute;inset:22%;border:2px solid #b9edff;border-radius:14px;pointer-events:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button,label{padding:13px 18px;border:1px solid #315873;border-radius:12px;background:#123450;color:#fff;font:700 14px system-ui;cursor:pointer}label input{display:none}input[type=text]{width:100%;padding:15px;background:#0c2032;color:#fff;border:1px solid #315873;border-radius:12px}a{color:#c8e6ff}#state{min-height:48px}button:disabled{opacity:.5}</style></head><body><main><small>RISP IT ASSET</small><h1>Scan a device</h1><p>Point the rear camera at the QR label, or choose a QR image.</p><div class="camera"><video id="video" playsinline muted></video><div class="guide"></div></div><p id="state" role="status" aria-live="polite">Ready to start</p><div class="actions"><button id="start">Start camera</button><label>Choose QR image<input id="image" type="file" accept="image/*"></label></div><input id="manual" type="text" placeholder="Libib / Asset Tag / Serial"><div class="actions"><button id="find">Find device</button><a id="back" hidden>Back to inventory</a></div></main><script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.legacy.min.js"></script><script>
(function(){'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);let dest=null,scanner=null,busy=false,startPromise=null,epoch=0;
try{const u=new URL(params.get('return')||'');if(u.protocol==='https:'&&u.hostname==='script.google.com'&&u.pathname.includes('/s/')&&u.pathname.endsWith('/exec'))dest=u;}catch(e){}
if(dest){$('back').href=dest.href;$('back').hidden=false;}
function stop(){epoch++;if(scanner){scanner.destroy();scanner=null;}if($('video').srcObject){$('video').srcObject.getTracks().forEach(t=>t.stop());$('video').srcObject=null;}}
function done(raw){raw=String(raw||'').trim();if(!raw||busy)return;busy=true;stop();if(!dest){$('state').textContent='QR: '+raw+' — Open this scanner from your inventory to return to the device.';busy=false;return;}const u=new URL(dest.href);u.searchParams.delete('id');u.searchParams.delete('scan');u.searchParams.delete('addscan');u.searchParams.set(params.get('mode')==='add'?'addscan':'scan',raw);$('state').textContent='QR found. Opening inventory…';location.replace(u.href);}
async function start(){if(startPromise)return startPromise;busy=false;stop();const job=epoch;startPromise=(async()=>{try{if(!window.QrScanner)throw new Error('Scanner could not load. Check your internet connection.');const engine=new QrScanner($('video'),r=>done(r.data),{preferredCamera:'environment',maxScansPerSecond:15,returnDetailedScanResult:true,highlightScanRegion:true,calculateScanRegion:v=>({x:0,y:0,width:v.videoWidth||1280,height:v.videoHeight||720,downScaledWidth:960,downScaledHeight:Math.max(1,Math.round(960*(v.videoHeight||720)/(v.videoWidth||1280)))})});scanner=engine;engine.setInversionMode('both');$('state').textContent='Starting camera…';await engine.start();if(job!==epoch){engine.destroy();return;}$('state').textContent='Camera live • Point at the QR label';}catch(e){$('state').textContent=e.name==='NotAllowedError'?'Allow camera access, then tap Start camera.':String(e.message||e);}finally{startPromise=null;}})();return startPromise;}
$('start').onclick=start;$('find').onclick=()=>done($('manual').value);$('manual').onkeydown=e=>{if(e.key==='Enter')done($('manual').value)};
$('image').onchange=async function(){const f=this.files&&this.files[0];this.value='';if(!f)return;stop();busy=false;$('state').textContent='Reading QR image…';try{const r=await QrScanner.scanImage(f,{returnDetailedScanResult:true,alsoTryWithoutScanRegion:true});done(r.data);}catch(e){$('state').textContent='No QR found. Choose a clearer image or enter the code.';}};
window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});start();
})();</script></body></html>
