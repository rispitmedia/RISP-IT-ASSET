<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071321">
<title>RISP QR Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071321;color:#e5f2fc;font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:640px;margin:auto;padding:24px 18px calc(24px + env(safe-area-inset-bottom))}
small{letter-spacing:.14em;font-weight:800;color:#84bde9}h1{margin:6px 0;font-size:clamp(26px,7vw,38px);letter-spacing:-.04em}p{color:#9db3c6}
.camera{position:relative;aspect-ratio:1;border:1px solid #4b89b3;border-radius:24px;overflow:hidden;background:#02070c;box-shadow:0 18px 44px #0008,0 0 0 1px #8edbff12 inset,0 0 28px #2386c522}
video{width:100%;height:100%;object-fit:cover;display:block}.guide{position:absolute;inset:14%;border:2px solid #b9edff;border-radius:16px;pointer-events:none;box-shadow:0 0 0 999px #02101a26,0 0 18px #6dd7ff66 inset}.guide:after{content:"MOVE CLOSER OR FARTHER";position:absolute;left:50%;bottom:-27px;transform:translateX(-50%);white-space:nowrap;color:#9bdcff;font-size:9px;font-weight:900;letter-spacing:.12em;text-shadow:0 1px 8px #000}
.scan-line{position:absolute;left:15%;right:15%;top:18%;height:2px;background:#8ee8ff;box-shadow:0 0 14px #65dcff;animation:scanline 1.55s ease-in-out infinite;pointer-events:none}@keyframes scanline{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(350px);opacity:1}}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button,label{padding:13px 18px;border:1px solid #315873;border-radius:12px;background:#123450;color:#fff;font:700 14px system-ui;cursor:pointer}button:active,label:active{transform:translateY(1px)}label input{display:none}input[type=text]{width:100%;padding:15px;background:#0c2032;color:#fff;border:1px solid #315873;border-radius:12px;outline:0}input[type=text]:focus{border-color:#9bdcff;box-shadow:0 0 0 3px #62c8ff22}a{color:#c8e6ff}#state{min-height:48px;margin:12px 0}#signal{min-height:18px;color:#68e9ae;font-size:11px;font-weight:800;letter-spacing:.1em}button:disabled{opacity:.5}
</style>
</head>
<body>
<main>
  <small>RISP IT ASSET</small>
  <h1>Scan a device</h1>
  <p>Use the rear camera. Keep the whole QR visible; the scanner now supports both close and far distances.</p>
  <div class="camera"><video id="video" playsinline muted></video><div class="guide"></div><div class="scan-line"></div></div>
  <p id="state" role="status" aria-live="polite">Ready to start</p><div id="signal" aria-live="polite"></div>
  <div class="actions"><button id="start" type="button">Start camera</button><label>Choose QR image<input id="image" type="file" accept="image/*"></label></div>
  <input id="manual" type="text" placeholder="Libib / Asset Tag / Serial">
  <div class="actions"><button id="find" type="button">Find device</button><a id="back" hidden>Back to inventory</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.legacy.min.js"></script>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
let dest=null,scanner=null,busy=false,startPromise=null,epoch=0,watchdog=null,assistTimer=null,detector=null,nativeBusy=false,audioCtx=null,lastSound=0;
const allowedHosts=['script.google.com','rispitmedia.github.io','risphuket.ac.th'];
try{const u=new URL(params.get('return')||'');if(u.protocol==='https:'&&allowedHosts.some(h=>u.hostname===h||u.hostname.endsWith('.'+h)))dest=u}catch(e){}
if(dest){$('back').href=dest.href;$('back').hidden=false}
function clearWatchdog(){if(watchdog){clearInterval(watchdog);watchdog=null}}
function clearAssist(){if(assistTimer){clearInterval(assistTimer);assistTimer=null}detector=null;nativeBusy=false}
function primeAudio(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;if(!audioCtx)audioCtx=new AC();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}catch(e){return null}}
function playScanSound(){const nowMs=Date.now();if(nowMs-lastSound<800)return;lastSound=nowMs;const ctx=primeAudio();if(!ctx)return;const play=()=>{try{const now=ctx.currentTime,g=ctx.createGain(),o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(880,now);o.frequency.exponentialRampToValueAtTime(1320,now+.075);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.24,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+.18);o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+.2);$('signal').textContent='✓ QR DETECTED • OPENING DEVICE';setTimeout(()=>{$('signal').textContent=''},1500)}catch(e){}};if(ctx.state==='suspended')ctx.resume().then(play).catch(()=>{});else play();if(navigator.vibrate)navigator.vibrate([35,35,65])}
function stop(){epoch++;clearWatchdog();clearAssist();if(scanner){try{scanner.destroy()}catch(e){}scanner=null}const v=$('video');if(v&&v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}}
function scanRegion(v){const w=Math.max(1,v.videoWidth||1920),h=Math.max(1,v.videoHeight||1080),max=1600,s=Math.min(1,max/Math.max(w,h));return{x:0,y:0,width:w,height:h,downScaledWidth:Math.max(1,Math.round(w*s)),downScaledHeight:Math.max(1,Math.round(h*s))}}
async function tuneTrack(){try{const v=$('video'),stream=v.srcObject,track=stream&&stream.getVideoTracks&&stream.getVideoTracks()[0];if(!track)return;const caps=track.getCapabilities?track.getCapabilities():{},advanced=[];if(Array.isArray(caps.focusMode)&&caps.focusMode.includes('continuous'))advanced.push({focusMode:'continuous'});if(Array.isArray(caps.exposureMode)&&caps.exposureMode.includes('continuous'))advanced.push({exposureMode:'continuous'});if(Array.isArray(caps.whiteBalanceMode)&&caps.whiteBalanceMode.includes('continuous'))advanced.push({whiteBalanceMode:'continuous'});await track.applyConstraints({width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:60},advanced}).catch(()=>{})}catch(e){}}
function startNativeAssist(){if(!('BarcodeDetector'in window))return;try{detector=new BarcodeDetector({formats:['qr_code']})}catch(e){detector=null;return}assistTimer=setInterval(async()=>{if(nativeBusy||busy||!scanner||!detector)return;const v=$('video');if(!v||v.readyState<2)return;nativeBusy=true;try{const codes=await detector.detect(v);if(codes&&codes[0]&&codes[0].rawValue)done(codes[0].rawValue)}catch(e){}finally{nativeBusy=false}},130)}
function done(raw){raw=String(raw||'').trim();if(!raw||busy)return;busy=true;playScanSound();stop();if(!dest){$('state').textContent='QR: '+raw+' — Open this scanner from your inventory to return to the device.';busy=false;return}const u=new URL(dest.href);u.searchParams.delete('id');u.searchParams.delete('scan');u.searchParams.delete('addscan');u.searchParams.set(params.get('mode')==='add'?'addscan':'scan',raw);$('state').textContent='QR found. Opening inventory…';location.replace(u.href)}
async function start(){if(startPromise)return startPromise;busy=false;stop();const job=epoch;primeAudio();$('state').textContent='Starting camera…';startPromise=(async()=>{try{if(!window.QrScanner)throw new Error('Scanner could not load. Check your internet connection.');const v=$('video'),engine=new QrScanner(v,r=>{const raw=String(r&&r.data!=null?r.data:r||'').trim();if(raw&&!busy)done(raw)},{preferredCamera:'environment',maxScansPerSecond:30,returnDetailedScanResult:true,highlightScanRegion:true,highlightCodeOutline:true,calculateScanRegion:scanRegion});scanner=engine;try{engine.setInversionMode('both')}catch(e){}await engine.start();if(job!==epoch){try{engine.destroy()}catch(e){}return}await tuneTrack();startNativeAssist();$('state').textContent='Camera live • aim at QR';clearWatchdog();watchdog=setInterval(()=>{if(document.hidden||busy||!scanner)return;const v=$('video'),track=v&&v.srcObject&&v.srcObject.getVideoTracks&&v.srcObject.getVideoTracks()[0];if(!track||track.readyState!=='live'||v.readyState<2){$('state').textContent='Recovering camera…';start().catch(()=>{})}},1800)}catch(e){$('state').textContent=e.name==='NotAllowedError'?'Allow camera access, then tap Start camera.':String(e.message||e)}finally{startPromise=null}})();return startPromise}
document.addEventListener('pointerdown',primeAudio,{once:true});$('start').onclick=start;$('find').onclick=()=>done($('manual').value);$('manual').onkeydown=e=>{if(e.key==='Enter')done($('manual').value)};
$('image').onchange=async function(){const f=this.files&&this.files[0];this.value='';if(!f)return;stop();busy=false;$('state').textContent='Reading QR image…';try{const r=await QrScanner.scanImage(f,{returnDetailedScanResult:true,alsoTryWithoutScanRegion:true});done(r&&r.data!=null?r.data:r)}catch(e){$('state').textContent='No QR found. Choose a clearer image or enter the code.'}};
window.addEventListener('pagehide',stop);window.addEventListener('pageshow',()=>{if(!document.hidden&&!busy)start().catch(()=>{})});document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(!busy)setTimeout(()=>start().catch(()=>{}),120)});start();
})();
</script>
</body>
</html>
